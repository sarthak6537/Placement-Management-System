<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Placement Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>Placement</h1>
    <form th:action="@{/ui/placements}" th:object="${placement}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div>
            <label>Company Name</label>
            <input type="text" th:field="*{companyName}" />
            <div class="error" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
        </div>
        <div>
            <label>Date</label>
            <input type="date" th:field="*{date}" />
            <div class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
        </div>
        <div>
            <label>Students</label>
            <select name="studentIds" multiple size="6">
                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.firstName + ' ' + s.lastName}" th:selected="${placement.students.contains(s)}"></option>
            </select>
            <div class="hint">Hold Ctrl/Cmd to select multiple students</div>
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/ui/placements}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
