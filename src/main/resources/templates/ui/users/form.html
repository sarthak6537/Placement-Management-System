<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>User</h1>
    <form th:action="@{/ui/users}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div>
            <label>Username</label>
            <input type="text" th:field="*{username}" />
            <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div>
            <label>Password</label>
            <input type="password" th:field="*{password}" />
            <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div>
            <label>Email</label>
            <input type="email" th:field="*{email}" />
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/ui/users}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
