<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>Add Student</h1>
    <form th:action="@{/ui/students}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div>
            <label>First name</label>
            <input type="text" th:field="*{firstName}" />
            <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </div>
        <div>
            <label>Last name</label>
            <input type="text" th:field="*{lastName}" />
            <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
        </div>
        <div>
            <label>Email</label>
            <input type="email" th:field="*{email}" />
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div>
            <button type="submit">Save</button>
            <a th:href="@{/ui/students}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
